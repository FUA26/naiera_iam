<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SIJI - Single Identity Jaringan Integrasi</title>
        <link rel="icon" type="image/png" href="/siji.png" />
        <style>
            /* Inline loading indicator — replaced when React mounts */
            #root:empty {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background: #fff;
            }
            #root:empty::after {
                content: "";
                width: 36px;
                height: 36px;
                border: 3px solid #fecaca;
                border-top-color: #dc2626;
                border-radius: 50%;
                animation: siji-spin 0.6s linear infinite;
            }
            @keyframes siji-spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
